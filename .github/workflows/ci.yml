name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint, typecheck, test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --frozen --all-groups

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy src

      - name: Pytest with coverage
        run: uv run pytest --cov=secretsync --cov-report=term-missing --cov-fail-under=80

      - name: Security canaries
        run: uv run pytest -m security -q

      - name: Build wheel and sdist
        run: uv build

      - name: Wheel import smoke
        shell: bash
        run: |
          wheel=$(ls dist/secretsync_cli-*.whl | head -1)
          uv run --with "$wheel" --no-project secretsync --help
