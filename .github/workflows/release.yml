name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semver component to bump (none = publish current version as-is)
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - none
        default: patch

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Bump, build, publish
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          # Need full history for annotated tags / release notes context.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --frozen --all-groups

      - name: Quality gates
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src
          uv run pytest --cov=secretsync --cov-fail-under=80 -q

      - name: Resolve version
        id: version
        run: |
          if [ "${{ inputs.bump }}" != "none" ]; then
            uv version --bump "${{ inputs.bump }}"
          fi
          VERSION="$(uv version --short)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${{ inputs.bump }}" != "none" ]; then
            git add pyproject.toml uv.lock
            git commit -m "release: ${{ steps.version.outputs.tag }}"
            git push origin HEAD
          fi
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Build artifacts
        run: uv build

      - name: SHA256SUMS
        working-directory: dist
        run: |
          sha256sum secretsync-*.whl secretsync-*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Publish to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.UV_PUBLISH_TOKEN }}
        run: uv publish

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            dist/*.whl \
            dist/*.tar.gz \
            dist/SHA256SUMS \
            --generate-notes \
            --title "${{ steps.version.outputs.tag }}"
