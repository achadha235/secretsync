version: 1
changeDetection: always-write
secrets:
  apiKey:
    env: API_KEY
sets:
  production:
    include: [apiKey]
destinations:
  vercel:
    connector: vercel
    teamId: team_abc
    # project intentionally missing
    auth:
      tokenEnv: VERCEL_TOKEN
deployments:
  - name: vercel-production
    set: production
    destination: vercel
    scope:
      kind: environment
      targets: [production]
    secrets:
      apiKey: API_KEY
