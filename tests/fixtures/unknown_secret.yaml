version: 1
changeDetection: always-write
secrets:
  a:
    env: A_ENV
sets:
  s:
    include: [a]
destinations:
  github:
    connector: github-actions
    repository: org/repo
    auth:
      tokenEnv: GITHUB_TOKEN
deployments:
  - name: d1
    set: s
    destination: github
    scope:
      kind: repository
    secrets:
      missingSecret: A
