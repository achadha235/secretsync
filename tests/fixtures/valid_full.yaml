version: 1
changeDetection: always-write
secrets:
  databaseUrl:
    env: YB_DATABASE_URL
  stripeSecretKey:
    env: STRIPE_SECRET_KEY
  sentryDsn:
    env: SENTRY_DSN
sets:
  common:
    include: [databaseUrl, sentryDsn]
  production:
    extends: common
    include: [stripeSecretKey]
  staging:
    extends: common
    include: [stripeSecretKey]
    overrides:
      databaseUrl:
        env: YB_STAGING_DATABASE_URL
destinations:
  github:
    connector: github-actions
    repository: yellowbrick/web
    auth:
      tokenEnv: GITHUB_TOKEN
  vercel:
    connector: vercel
    project: web
    teamId: team_abc
    auth:
      tokenEnv: VERCEL_TOKEN
  sst:
    connector: sst
    workingDirectory: ./apps/web
    executable: bunx
deployments:
  - name: github-production
    set: production
    destination: github
    scope:
      kind: environment
      environment: production
    secrets:
      databaseUrl: DATABASE_URL
      stripeSecretKey: STRIPE_SECRET_KEY
  - name: vercel-production
    set: production
    destination: vercel
    scope:
      kind: environment
      targets: [production]
    secrets:
      databaseUrl: POSTGRES_URL
      stripeSecretKey: STRIPE_SECRET_KEY
      sentryDsn: NEXT_PUBLIC_SENTRY_DSN
  - name: sst-production
    set: production
    destination: sst
    scope:
      stage: production
      fallback: false
    secrets:
      databaseUrl: DatabaseUrl
      stripeSecretKey: StripeSecretKey
