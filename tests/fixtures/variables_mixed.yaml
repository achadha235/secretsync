version: 1
changeDetection: always-write
secrets:
  apiKey:
    env: API_KEY
variables:
  logLevel:
    env: LOG_LEVEL
sets:
  production:
    include: [apiKey, logLevel]
destinations:
  github:
    connector: github-actions
    repository: owner/repo
    auth:
      tokenEnv: GITHUB_TOKEN
  vercel:
    connector: vercel
    project: web
    auth:
      tokenEnv: VERCEL_TOKEN
deployments:
  - name: github-production
    set: production
    destination: github
    scope:
      kind: environment
      environment: production
    secrets:
      apiKey: API_KEY
    variables:
      logLevel: LOG_LEVEL
  - name: vercel-production
    set: production
    destination: vercel
    scope:
      targets: [production]
    secrets:
      apiKey: API_KEY
    variables:
      logLevel: LOG_LEVEL
