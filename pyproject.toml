[project]
name = "secretsync"
version = "0.1.0"
description = "Declarative secret delivery across deployment platforms"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "SecretSync contributors" }]
requires-python = ">=3.12"
keywords = ["secrets", "github-actions", "vercel", "sst", "1password", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Build Tools",
]
dependencies = [
  "click>=8.4,<9",
  "textual>=8.2,<9",
  "pydantic>=2.13,<3",
  "pyyaml>=6.0.2,<7",
  "httpx>=0.28,<1",
  "pynacl>=1.5,<2",
  "anyio>=4.9,<5",
]

[project.urls]
Homepage = "https://github.com/achadha235/secretsync"
Repository = "https://github.com/achadha235/secretsync"
Issues = "https://github.com/achadha235/secretsync/issues"
Changelog = "https://github.com/achadha235/secretsync/blob/main/CHANGELOG.md"

[project.scripts]
secretsync = "secretsync.cli:cli"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1,<2",
  "pytest-cov>=6,<8",
  "respx>=0.22,<1",
  "ruff>=0.12,<1",
  "mypy>=1.17,<2",
  "types-pyyaml>=6.0.12",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "smoke: opt-in live provider tests (require SECRETSYNC_SMOKE=1 and credentials)",
  "security: canary and no-leak security suite (runs in default CI)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["secretsync"]
