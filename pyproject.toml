[project]
name = "secretsync"
version = "0.1.0"
description = "Declarative secret delivery across deployment platforms"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "click>=8.4,<9",
  "textual>=8.2,<9",
  "pydantic>=2.13,<3",
  "pyyaml>=6.0.2,<7",
  "httpx>=0.28,<1",
  "pynacl>=1.5,<2",
  "anyio>=4.9,<5",
  "platformdirs>=4.3,<5",
]

[project.scripts]
secretsync = "secretsync.cli:cli"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1,<2",
  "respx>=0.22,<1",
  "ruff>=0.12,<1",
  "mypy>=1.17,<2",
  "types-pyyaml>=6.0.12",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "smoke: opt-in live provider tests (require SECRETSYNC_SMOKE=1 and credentials)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["secretsync"]
