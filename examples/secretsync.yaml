version: 1
changeDetection: always-write

secrets:
  secretOneProd:
    env: SECRET_ONE_PROD
  secretOneStaging:
    env: SECRET_ONE_STAGING
  secretTwoCommon:
    env: SECRET_TWO_COMMON

  secretThreeOrgProd:
    env: SECRET_THREE_ORG_PROD
  secretThreeOrgStaging:
    env: SECRET_THREE_ORG_STAGING

variables:
  publicAppUrlProd:
    env: PUBLIC_APP_URL_PROD
  publicAppUrlStaging:
    env: PUBLIC_APP_URL_STAGING
  logLevelProd:
    env: LOG_LEVEL_PROD
  logLevelStaging:
    env: LOG_LEVEL_STAGING
  orgName:
    env: ORG_NAME

sets:
  common:
    include: [secretTwoCommon, orgName]
  production:
    extends: common
    include: [secretOneProd, secretThreeOrgProd, publicAppUrlProd, logLevelProd]
  staging:
    extends: common
    include:
      [
        secretOneStaging,
        secretThreeOrgStaging,
        publicAppUrlStaging,
        logLevelStaging,
      ]

destinations:
  github:
    connector: github-actions
    repository: achadha235/secretsync-example-vercel
    auth:
      tokenEnv: GITHUB_TOKEN
  vercel:
    connector: vercel
    project: prj_0o2jv54Q9xlbI33lamIyF4ksGdIl
    teamId: team_GFsGvjkKogSeeSjt3ryN5mLK
    auth:
      tokenEnv: VERCEL_TOKEN
  sst:
    connector: sst
    workingDirectory: ./secretsync-sst-example
    executable: bunx

deployments:
  ### Examples for GitHub deployment

  ##########################################################################################
  ## Environment-level secrets [Production]
  ##########################################################################################
  - name: github-production
    set: production
    destination: github
    scope:
      kind: environment
      environment: Production
    secrets:
      secretOneProd: SECRET_ONE
      secretTwoCommon: SECRET_TWO
    variables:
      logLevelProd: LOG_LEVEL
      publicAppUrlProd: PUBLIC_APP_URL

  ## Environment-level secrets [Staging]
  - name: github-staging
    set: staging
    destination: github
    scope:
      kind: environment
      environment: Preview
    secrets:
      secretOneStaging: SECRET_ONE
      secretTwoCommon: SECRET_TWO
    variables:
      logLevelStaging: LOG_LEVEL

  ### Organization-level secrets
  # - name: github-org
  #   set: production
  #   destination: github
  #   scope:
  #     kind: organization
  #     visibility: all
  #   secrets:
  #     secretThreeOrgProd: SECRET_THREE_ORG
  #   variables:
  #     orgName: ORG_NAME

  ##########################################################################################
  ## Vercel deployments
  ##########################################################################################

  ## Vercel deployments [Production]
  - name: vercel-production
    set: production
    destination: vercel
    scope:
      kind: environment
      targets: [production]
    secrets:
      secretOneProd: SECRET_ONE
    variables:
      publicAppUrlProd: PUBLIC_APP_URL
      logLevelProd: LOG_LEVEL

  ## Vercel deployments [Previews]
  - name: vercel-staging
    set: staging
    destination: vercel
    scope:
      kind: environment
      targets: [preview]
    secrets:
      secretOneStaging: SECRET_ONE
    variables:
      publicAppUrlStaging: PUBLIC_APP_URL
      logLevelStaging: LOG_LEVEL

  ## Vercel organization-level secrets
  - name: vercel-shared-production
    set: production
    destination: vercel
    scope:
      kind: shared-environment
      targets: [production]
    secrets:
      secretThreeOrgProd: SECRET_THREE_ORG
    variables:
      logLevelProd: LOG_LEVEL

  - name: vercel-shared-preview
    set: staging
    destination: vercel
    scope:
      kind: shared-environment
      targets: [preview]
    secrets:
      secretThreeOrgStaging: SECRET_THREE_ORG
    variables:
      logLevelStaging: LOG_LEVEL

  - name: vercel-shared-common
    set: common
    destination: vercel
    scope:
      kind: shared-environment
      targets: [production, preview]
    secrets:
      secretTwoCommon: SECRET_TWO
    variables:
      orgName: ORG_NAME

  ##########################################################################################
  ## SST deployments
  ##########################################################################################

  ## SST deployments [Staging]
  - name: sst-staging
    set: staging
    destination: sst
    scope:
      stage: staging
      fallback: false
    secrets:
      secretOneStaging: SecretOne
      secretTwoCommon: SecretTwo

  - name: sst-production
    set: production
    destination: sst
    scope:
      stage: production
      fallback: false
    secrets:
      secretOneProd: SecretOne
      # secretTwoCommon: SecretTwo
