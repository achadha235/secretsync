version: 1
changeDetection: always-write

secrets:
  secretOneProd:
    env: SECRET_ONE_PROD
  secretOneStaging:
    env: SECRET_ONE_STAGING
  secretTwoCommon:
    env: SECRET_TWO_COMMON

variables:
  publicAppUrl:
    env: PUBLIC_APP_URL
  logLevel:
    env: LOG_LEVEL

sets:
  common:
    include: [secretTwoCommon, logLevel]
  production:
    extends: common
    include: [secretOneProd, publicAppUrl]
  staging:
    extends: common
    include: [secretOneStaging, publicAppUrl]

destinations:
  github:
    connector: github-actions
    repository: achadha235/secretsync-example-vercel
    auth:
      tokenEnv: GITHUB_TOKEN
  vercel:
    connector: vercel
    project: prj_0o2jv54Q9xlbI33lamIyF4ksGdIl
    teamId: team_GFsGvjkKogSeeSjt3ryN5mLK
    auth:
      tokenEnv: VERCEL_TOKEN
  sst:
    connector: sst
    workingDirectory: ./examples/secretsync-sst-example
    executable: bunx

deployments:
  - name: github-production
    set: production
    destination: github
    scope:
      kind: environment
      environment: Production
    secrets:
      secretOneProd: SECRET_ONE
      secretTwoCommon: SECRET_TWO
    variables:
      logLevel: LOG_LEVEL
      publicAppUrl: PUBLIC_APP_URL
  - name: github-staging
    set: staging
    destination: github
    scope:
      kind: environment
      environment: Preview
    secrets:
      secretOneStaging: SECRET_ONE
      secretTwoCommon: SECRET_TWO
    variables:
      logLevel: LOG_LEVEL
  - name: vercel-production
    set: production
    destination: vercel
    scope:
      kind: environment
      targets: [production]
    secrets:
      secretOneProd: SECRET_ONE
      secretTwoCommon: SECRET_TWO
    variables:
      publicAppUrl: PUBLIC_APP_URL
  - name: vercel-preview
    set: staging
    destination: vercel
    scope:
      kind: environment
      targets: [preview]
    secrets:
      secretOneStaging: SECRET_ONE
    variables:
      publicAppUrl: PUBLIC_APP_URL
  - name: sst-staging
    set: staging
    destination: sst
    scope:
      stage: staging
      fallback: false
    secrets:
      secretOneStaging: SecretOne
      secretTwoCommon: SecretTwo
