version: 1
changeDetection: always-write

secrets:
  uvPublishToken:
    env: UV_PUBLISH_TOKEN

sets:
  production:
    include: [uvPublishToken]

destinations:
  github:
    connector: github-actions
    repository: achadha235/secretsync
    auth:
      tokenEnv: GITHUB_TOKEN

deployments:
  - name: github-production
    set: production
    destination: github
    scope:
      kind: environment
      environment: production
    secrets:
      uvPublishToken: UV_PUBLISH_TOKEN
